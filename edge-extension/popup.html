<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; font-family: "Microsoft YaHei", sans-serif; margin: 0; padding: 14px; font-size: 13px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin: 10px 0 4px; font-weight: bold; }
  input[type=text], input[type=number], textarea { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #ccc; border-radius: 5px; font-size: 13px; }
  textarea { height: 72px; resize: vertical; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .row input[type=number] { width: 60px; }
  .switch { display: flex; align-items: center; gap: 6px; }
  button { border: none; border-radius: 6px; padding: 8px 10px; font-size: 13px; cursor: pointer; }
  .primary { background: #0099ff; color: #fff; width: 100%; margin-top: 12px; }
  .ghost { background: #eef4fb; color: #0077cc; flex: 1; }
  .btns { display: flex; gap: 8px; margin-top: 8px; }
  #status { margin-top: 12px; padding: 8px; border-radius: 6px; background: #f5f7fa; font-size: 12px; color: #555; min-height: 16px; white-space: pre-wrap; }
  .hint { color: #999; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
  <h1>QQ频道帖子关键字提醒</h1>

  <div class="switch">
    <input type="checkbox" id="enabled">
    <label for="enabled" style="margin:0;font-weight:bold;">开启监控</label>
  </div>

  <label>关键字（一行一个）</label>
  <textarea id="keywords" placeholder="在这里输入你要监控的词，每行一个"></textarea>

  <label>频道</label>
  <input type="text" id="guild" placeholder="iloveswufe">
  <div class="hint">填频道链接 pd.qq.com/g/ 后面那段</div>

  <div class="row">
    <label style="margin:0;">检查间隔</label>
    <input type="number" id="interval" min="30" value="60">
    <span>秒</span>
  </div>
  <div class="hint">浏览器最快约 30 秒/次；填小于 30 会按 30 秒执行</div>

  <label>微信推送 token（可选）</label>
  <input type="text" id="pushToken" placeholder="不填=只桌面弹窗；填了=同时推微信">
  <div class="hint">想手机微信也收到，去 <a href="https://www.pushplus.plus/" target="_blank">pushplus.plus</a> 扫码拿 token 填这里</div>

  <button class="primary" id="save">保存设置</button>
  <div class="btns">
    <button class="ghost" id="test">测试弹窗+接口</button>
    <button class="ghost" id="check">立即检查一次</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
